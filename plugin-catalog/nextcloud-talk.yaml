name: nextcloud-talk
title: Nextcloud Talk
repo: https://github.com/Cliff3c/hermes-nextcloud-talk
sha: d50264db11cdf79a13011628e89168be64427b37
subdir: plugin
description: Signed Nextcloud Talk bot webhooks and text replies for Hermes, with JSON/XML OCS support.
maintainer: Cliff3c
tier: community
category: platform
version: "0.2.1"
readme: true
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - NC_TALK_BASE_URL
    - NC_TALK_BOT_SECRET
known_issues:
  - Text only; attachments, reactions and inbound reply-context reconstruction are not implemented.
  - Dedupe is in-memory and does not survive restart; uncertain sends are not automatically retried.
  - Valid empty OCS acknowledgements confirm delivery without returning a message ID.
